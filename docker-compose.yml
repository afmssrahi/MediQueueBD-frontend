# MediQueue BD — frontend, runnable with `docker compose up`
#
# The image is built from ./Dockerfile. Everything the app needs is baked in,
# so a fresh clone only needs Docker — no Node.js install on the host.
#
# The AI summary service is a separate backend in the sibling folder
# `../ai-summary-prototype`. It sits behind the `ai` profile, so this file
# works even when someone has cloned **only** this folder:
#
#   docker compose up --build                 # just the frontend
#   docker compose --profile ai up --build   # the frontend + the AI service
#
# Without the AI service the app still runs — the /patient/summary screen
# falls back to the bundled demo data.
#
# For the whole stack (frontend + AI summary service + optional MySQL), use the
# compose file in the parent folder instead: `docker compose up --build` from
# the repository root.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined into the browser bundle at build
        # time. Change them here (or in .env) and rebuild to change behaviour.
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-mock}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
    image: mediqueue-frontend:latest
    ports:
      # host:container — edit the left side to use a different host port
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Server-side only — never exposed to the browser. Read per request by
      # src/proxy.ts, so it can be changed without rebuilding the image.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-summary:4100/api}
    depends_on:
      ai-summary:
        condition: service_healthy
        required: false
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── the AI summary service (optional) ─────────────────────────────────────
  # It turns an uploaded prescription or medical record into a summary, a
  # patient history and a list of real literature references.
  ai-summary:
    profiles: ["ai"]
    build:
      context: ../ai-summary-prototype
      dockerfile: Dockerfile
    image: mediqueue-ai-summary:latest
    ports:
      - "${AI_PORT:-4100}:4100"
    environment:
      PORT: 4100
      HOST: 0.0.0.0
      DATA_DIR: /data
      # With no key the offline heuristic extractor runs, so the service always
      # starts. A key only changes how well photographed documents are read.
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITERATURE_ENABLED: ${LITERATURE_ENABLED:-true}
      LITERATURE_EMAIL: ${LITERATURE_EMAIL:-}
      DB_DRIVER: ${DB_DRIVER:-sqlite}
    volumes:
      - ai-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ai-data:
